[project]
name = "mail-shared"
version = "0.1.0"
description = "Shared database helpers for the RevBridge Connect email services"
requires-python = ">=3.11"
dependencies = [
    # Pydantic — schemas/ subpackage
    "pydantic==2.13.4",
    # Cryptography — tokens/ Fernet decoder
    "cryptography==49.0.0",
    # MySQL sync driver — db/mysql_sync (api, tracking, milter, infra)
    "mysql-connector-python==9.7.0",
    # connect-lib — auth, outbox events, logging, observability
    "connect-lib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_shared"]
