name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Variable catalog is complete
        run: python3 tools/manifest/scan_env.py --check
      - name: Python compiles
        run: python3 -m compileall -q services shared libs scripts tools mta
      - name: Configuration renders and compose files are valid
        run: |
          python3 scripts/render_env.py
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the whole history for secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --log-opts="--all" --redact --no-banner

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the app image
        run: docker build -f docker/app.Dockerfile -t revbridge/connect-app:dev .
      - name: Unit tests
        run: bash tools/dev/run_unit_tests.sh

  panel:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  e2e:
    # full stack on the runner (the MTA delivers to Mailpit); run on demand and on main
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          python3 scripts/render_env.py
          docker compose -f docker-compose.yml -f docker-compose.dev.yml build
      - name: End-to-end suites
        run: make test
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --tail=200
