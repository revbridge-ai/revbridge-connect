## === Dovecot Global Configuration ===

# Enabled protocols (IMAP, POP3 and LMTP)
protocols = imap pop3 lmtp

# Listen on every IPv4 and IPv6 address
listen = *, ::

# Include the protocols installed by packages
!include_try /usr/share/dovecot/protocols.d/*.protocol

# Location of Dovecot's runtime data
# (the default is fine; change it only to run several instances)
# base_dir = /var/run/dovecot/

# Plugin dictionary (used by quota, sieve, etc.)
dict {
  # Example (when using quotas or sieve):
  # quota = mysql:/etc/dovecot/dovecot-dict-sql.conf.ext
}

# Include the main files of the modular configuration
!include conf.d/*.conf

# Include an optional local override, if present
!include_try local.conf
