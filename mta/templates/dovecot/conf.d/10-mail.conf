# Mail storage: one Maildir per domain and user.
mail_location = maildir:/var/mail/%d/%n

# System user that owns the mail files (the image creates `vmail` with uid 5000).
mail_uid = vmail

# Group of the mail files (shared by Dovecot and Postfix).
mail_gid = vmail

# Mailbox replication between servers.
mail_plugins = $mail_plugins notify replication

# The user's main namespace (Inbox), for IMAP clients.
namespace inbox {
  # Private namespace: one per user.
  type = private

  # Folder separator (e.g. Inbox/Sent).
  separator = /

  # This namespace holds the Inbox.
  inbox = yes

  # Drafts folder (special use).
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }

  # Spam folder (Junk).
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }

  # Sent folder.
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }

  # Trash folder.
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
}