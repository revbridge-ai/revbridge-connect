service auth {
  # UNIX socket that Postfix uses to authenticate through Dovecot (SASL).
  unix_listener /var/spool/postfix/private/auth {
    # Socket permissions: owner and group only.
    mode = 0660

    # Owner and group of the socket: Postfix.
    user = postfix
    group = postfix
  }

  # Optional, for external authentication clients
  # inet_listener auth {
  #   port = 12345
  # }
}

# LMTP delivery service (Postfix delivers to the mailboxes over LMTP).
service lmtp {
  # Socket that Postfix uses to deliver over LMTP.
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    # Socket permissions: owner only.
    mode = 0600

    # Owner and group of the socket: Postfix.
    user = postfix
    group = postfix
  }
}

# Mail process statistics tracking. Its behavior is very similar to the anvil process, but anvil’s data is of higher importance and lower traffic than stats, so stats are tracked in a separate process.
service stats {
  unix_listener stats-reader {
    user = vmail
    group = vmail
    mode = 0660
  }

  unix_listener stats-writer {
    user = vmail
    group = vmail
    mode = 0660
  }
}


service imap-login {
  inet_listener imaps {
    port = 993
    ssl = yes
    haproxy = yes
  }
}