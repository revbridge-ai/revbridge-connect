# Dovecot log file.
log_path = /var/log/dovecot.log

# Log details of authentication attempts (useful for diagnostics; may expose sensitive data on shared hosts).
auth_verbose = yes

# Authentication debug logs: very verbose, enable only temporarily.
auth_debug = no

###############################################################################
# Writes passwords (plain text or hashes) to the debug logs: a serious security risk.
# Use it only in a local test environment and turn it off afterwards.
###############################################################################
auth_debug_passwords = no

# Log timestamp format (ISO 8601, easy to parse for log tools and SIEMs).
log_timestamp = "%Y-%m-%dT%H:%M:%S.%6u%z "