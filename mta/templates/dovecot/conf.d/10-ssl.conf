###############################################################################
# The certificate is managed by tls-sync.sh: it copies the one Caddy issued (or the one in
# secrets/tls) to /etc/ssl/connect and reloads Dovecot when it is renewed.
###############################################################################

# Enable TLS.
ssl = yes

# Certificate (full chain).
ssl_cert = </etc/ssl/connect/fullchain.pem

# Private key of the certificate (never expose it).
ssl_key = </etc/ssl/connect/privkey.pem

# Minimum TLS version: 1.2 (TLS 1.0/1.1 are rejected).
ssl_min_protocol = TLSv1.2
