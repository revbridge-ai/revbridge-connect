# Log to syslog (it ends up in /var/log/mail.log).
Syslog          Yes

# Also log successful signatures.
SyslogSuccess       Yes

# Default permissions of the files OpenDKIM creates (group-readable).
UMask               002

###############################################################################
# No fixed Domain: the domains, selectors and keys come from the KeyTable and
# SigningTable Lua datasets below (read from the database).
###############################################################################
# Domain

# Do not sign subdomains automatically (avoids wrong signatures when a subdomain has no key).
SubDomains          No

# Restart OpenDKIM automatically when it fails.
AutoRestart         Yes

# At most 10 automatic restarts per hour (prevents restart loops).
AutoRestartRate     10/1h

# relaxed/relaxed canonicalization: tolerates small header and body changes in transit.
Canonicalization    relaxed/relaxed

# Mode sv: sign outbound mail and verify signatures.
Mode                sv

# Socket the Postfix milter connects to (milter_dkim in main.cf).
Socket              inet:8891@127.0.0.1

# PID file (its directory must exist).
PidFile             /var/run/opendkim/opendkim.pid

# KeyTable: maps a key name to domain, selector and private key (Lua dataset that reads the database).
KeyTable            lua:/etc/opendkim/lua/keytable.lua

# SigningTable: maps a sender to a KeyTable key name (Lua dataset that reads the database).
SigningTable        lua:/etc/opendkim/lua/signingtable.lua

# Internal hosts whose mail is signed.
InternalHosts       file:/etc/opendkim/TrustedHosts

# Headers covered by the signature. The OpenDKIM default list leaves out List-Unsubscribe-Post,
# and RFC 8058 (one-click unsubscribe, which Gmail and Yahoo require from bulk senders) needs
# BOTH List-Unsubscribe and List-Unsubscribe-Post signed. A listed header that a message does not
# have is simply skipped.
SignHeaders         From,Sender,Reply-To,To,Cc,Subject,Date,Message-ID,MIME-Version,Content-Type,Content-Transfer-Encoding,In-Reply-To,References,List-Id,List-Unsubscribe,List-Unsubscribe-Post,Feedback-ID

# Log why a DKIM signature was accepted, rejected or ignored (troubleshooting).
LogWhy              Yes
