[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

# rsyslog writes the Postfix log to /var/log/mail.log (mta-logs volume), which Vector reads
[program:rsyslog]
command=/usr/sbin/rsyslogd -n
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:opendkim]
command=/usr/sbin/opendkim -f -x /etc/opendkim.conf
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dovecot]
command=/usr/sbin/dovecot -F
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:postfix]
command=/usr/sbin/postfix start-fg
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# certificate renewed by Caddy -> reload Postfix and Dovecot
[program:cert-watch]
command=/bin/sh -c 'while true; do sleep ${TLS_SYNC_INTERVAL:-3600}; /opt/connect/tls-sync.sh; done'
autorestart=true
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# mail.log rotation (Vector follows the new file); without it the disk fills up
[program:logrotate]
command=/bin/sh -c 'while true; do sleep ${LOGROTATE_INTERVAL:-3600}; /usr/sbin/logrotate -s /var/lib/logrotate/connect.status /etc/logrotate.d/connect-mail; done'
autorestart=true
priority=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
