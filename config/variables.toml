services = ["lib"]
note = "runtime"

[LOG_LEVEL]
group = "runtime"
status = "keep"
code_default = "INFO"
services = ["api", "image-proxy", "lib", "milter", "tracking"]
note = "runtime"

[MALLOC_ARENA_MAX]
group = "runtime"
status = "keep"
value = "2"
note = "glibc: limits memory arenas of the Python processes"
curated = true

[MALLOC_TRIM_INTERVAL_SEC]
group = "runtime"
status = "keep"
code_default = "45"
services = ["milter"]
note = "runtime"

[OTEL_SDK_DISABLED]
group = "runtime"
status = "keep"
value = "true"
note = "OpenTelemetry off (no collector in the installation)"
curated = true

# ───────────── integrations ─────────────
[CACHE_TTL]
group = "integrations"
status = "keep"
services = ["image-proxy"]
note = "image cache TTL"
curated = true

[CONNECT_IMAGE_PROXY_WRAP]
group = "integrations"
status = "keep"
value = "true"
code_default = "false"
services = ["api"]
note = "the API wraps <img> tags through the image proxy (solid background behind transparent PNGs)"
curated = true

[IMAGE_PROXY_ENABLED]
group = "integrations"
status = "keep"
value = "true"
code_default = "true"
services = ["api"]
note = "enables wrapping <img> tags through the image proxy"
curated = true

[IMAGE_PROXY_FETCH_TIMEOUT]
group = "integrations"
status = "off"
code_default = "10"
services = ["image-proxy"]
note = "optional; see config/variables.overrides.toml"

[IMAGE_PROXY_INTERNAL_URL]
group = "integrations"
status = "off"
services = ["api"]
note = "optional; see config/variables.overrides.toml"

[IMAGE_PROXY_MAX_BYTES]
group = "integrations"
status = "off"
services = ["image-proxy"]
note = "optional; see config/variables.overrides.toml"

[IMAGE_PROXY_MAX_PIXELS]
group = "integrations"
status = "off"
services = ["image-proxy"]
note = "optional; see config/variables.overrides.toml"

[IMAGE_PROXY_MAX_SVG_BYTES]
group = "integrations"
status = "off"
services = ["image-proxy"]
note = "optional; see config/variables.overrides.toml"

[IMAGE_PROXY_URL]
group = "integrations"
status = "derive"
value = "https://{{endpoints.images}}"
services = ["api", "image-proxy"]
note = "not used by Connect"
curated = true

[MAX_IMAGE_SIZE]
group = "integrations"
status = "keep"
services = ["image-proxy"]
note = "maximum size of a source image"
curated = true

[MAX_SVG_SIZE]
group = "integrations"
status = "keep"
services = ["image-proxy"]
note = "maximum size of an uploaded SVG"
curated = true

[SERVICE_URL]
group = "integrations"
status = "derive"
value = "https://{{endpoints.images}}"
services = ["image-proxy"]
note = "public URL of the image proxy"
curated = true

# ───────────── internal ─────────────
[DOMAIN_NAME]
group = "internal"
status = "internal"
code_default = "default"
services = ["api", "tracking"]
note = "local script/test variable; not configuration"

[SHADOW_EMAIL]
group = "internal"
status = "internal"
services = ["api", "milter"]
note = "local script/test variable; not configuration"

# ───────────── api ─────────────
[RATE_LIMIT_REQUESTS]
group = "api"
status = "keep"
value = "6000"
code_default = "100"
services = ["api", "tracking"]
note = "requests per window per API key (100/s with the 60 s window): room for campaign bursts with one recipient per request; a runaway client still gets 429"
curated = true

[RATE_LIMIT_WINDOW]
group = "api"
status = "keep"
value = "60"
code_default = "60"
services = ["api", "tracking"]
note = "rate-limit window in seconds"
curated = true

# ───────────── images ─────────────
[IMAGE_CACHE_REDIS_URL]
group = "images"
status = "keep"
value = "redis://redis-cache:6379/0"
services = ["image-proxy"]
note = "the image proxy's own bounded Redis (redis-cache service, LRU); never the queue's Redis"
curated = true

[IMAGE_CACHE_TTL]
group = "images"
status = "keep"
value = "604800"
services = ["image-proxy"]
note = "seconds a processed image stays in the image cache"
curated = true

# ───────────── smtp ─────────────
[LOGROTATE_INTERVAL]
group = "smtp"
status = "keep"
value = "3600"
code_default = "3600"
services = ["mta"]
note = "seconds between logrotate runs for the MTA logs"
curated = true

[QUEUE_SUBMISSION_PORT]
group = "smtp"
status = "keep"
value = "2587"
code_default = "2587"
services = ["mta"]
note = "internal submission port the queue processors use (SASL with the customer's API key); not published on the host"
curated = true

[TLS_SYNC_INTERVAL]
group = "smtp"
status = "keep"
value = "3600"
code_default = "3600"
services = ["mta"]
note = "seconds between checks for a renewed SMTP certificate issued by Caddy (mta/tls-sync.sh)"
curated = true
