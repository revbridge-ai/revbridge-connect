<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>RevBridge Connect</title>
    <script>
      // Apply the saved theme and language before the first paint (avoids a flash).
      try {
        var t = localStorage.getItem('connect.theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
        var l = localStorage.getItem('connect.locale')
        if (l === 'pt-BR') document.documentElement.setAttribute('lang', 'pt-BR')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
