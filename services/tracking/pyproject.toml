[project]
name = "mail-tracking"
version = "0.1.0"
description = "Mail tracking service — pixel + click + unsubscribe"
requires-python = ">=3.11"
dependencies = [
    "mail-shared",
    # Web (fastapi comes from connect-lib/mail-shared: single source)
    "uvicorn[standard]==0.51.0",
    "pydantic-settings==2.14.2",
    # Cache
    "redis==7.4.1",
    # Env loader
    "python-dotenv==1.2.2",
]

[tool.uv.sources]
mail-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_tracking"]
