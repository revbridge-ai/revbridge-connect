[project]
name = "mail-api"
version = "0.1.0"
description = "Mail API service — REST + queue-processor + ledger-reaper + webhook-dispatcher"
requires-python = ">=3.11"
dependencies = [
    "mail-shared",
    # Web (fastapi comes from connect-lib/mail-shared, a single source)
    "uvicorn[standard]==0.51.0",
    "python-multipart==0.0.32",
    # MySQL covered by mail-shared. Keep pydantic-settings explicit.
    "pydantic-settings==2.14.2",
    # Cache + HTTP
    "redis==7.4.1",
    "httpx==0.28.1",
    "requests==2.34.2",
    # SMTP path (queue-processor)
    "aiosmtplib==5.1.2",
    "email-validator==2.3.0",
    "jinja2==3.1.6",
    # Auth (PyJWT comes from connect-lib/mail-shared, a single source)
    "python-jose[cryptography]==3.5.0",
    # Misc
    "python-dotenv==1.2.2",
    "python-dateutil==2.9.0.post0",
    "pytz==2026.2",
]

[tool.uv.sources]
mail-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_api"]
