[project]
name = "mail-milter"
version = "0.1.0"
description = "Postfix milter + events-updater"
requires-python = ">=3.11"
dependencies = [
    "mail-shared",
    # Web (events-updater): fastapi comes from connect-lib/mail-shared (single source)
    "uvicorn[standard]==0.51.0",
    "pydantic-settings==2.14.2",
    "python-multipart==0.0.32",
    # NOTE: pymilter is only installed by docker/milter.Dockerfile (needs libmilter-dev
    # at the OS level, breaks `uv sync` on dev machines without it). Lives in
    # the [milter] optional-dependencies group below.
    # Cache + HTTP
    "redis==7.4.1",
    "httpx==0.28.1",
    # Misc
    "email-validator==2.3.0",
    "python-dotenv==1.2.2",
    "prometheus-client==0.25.0",
]

[project.optional-dependencies]
# Installed only by docker/milter.Dockerfile (libmilter-dev required at OS level)
milter = ["pymilter==1.0.5"]

[tool.uv.sources]
mail-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_milter"]
